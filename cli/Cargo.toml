[package]
name = "hexshade"
version = "0.1.0"
edition = "2024"
description = "Hexshade blog publish tool — watch, index, and push in one command"

[[bin]]
name = "hexshade"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
